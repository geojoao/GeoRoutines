<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fenologia Pixel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #111; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a1a2e; padding: 10px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; }
    header h1 { font-size: 1.05rem; font-weight: 600; color: #a0c4ff; letter-spacing: .02em; }
    #hex-label { font-size: 0.82rem; color: #7a9abf; font-family: monospace; }
    #status { font-size: 0.82rem; color: #aaa; margin-left: auto; }
    .main { display: flex; flex: 1; min-height: 0; gap: 0; }
    #map { flex: 1 1 50%; min-width: 0; }
    .panel { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; background: #161625; border-left: 1px solid #2a2a4a; overflow: hidden; }
    .panel-header { padding: 10px 14px; font-size: 0.84rem; color: #8ab4d4; border-bottom: 1px solid #2a2a4a; flex-shrink: 0; }
    #pixel-info { padding: 8px 14px; font-size: 0.78rem; color: #aaa; border-bottom: 1px solid #22223a; flex-shrink: 0; line-height: 1.6; }
    #chart-wrap { flex: 1; padding: 10px 14px 14px; min-height: 0; position: relative; }
    canvas#pheno-chart { max-height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 4px 14px 8px; border-top: 1px solid #22223a; font-size: 0.72rem; color: #aaa; flex-shrink: 0; }
    .leg { display: flex; align-items: center; gap: 5px; }
    .leg-dot { width: 10px; height: 3px; border-radius: 2px; }
    .placeholder { display: flex; align-items: center; justify-content: center; flex: 1; color: #444; font-size: 0.9rem; text-align: center; padding: 20px; }

    /* Leaflet tooltip */
    .leaflet-tooltip.px-tip { background: #1a1a2e; border: 1px solid #3a5a8a; color: #c0d8f0; font-size: 0.78rem; padding: 4px 8px; }
    /* Loading spinner */
    #spinner { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:32px; height:32px; border:3px solid #333; border-top-color:#6af; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>Fenologia Pixel-Level</h1>
  <span id="hex-label">—</span>
  <span id="status">Carregando…</span>
</header>

<div class="main">
  <div id="map"></div>
  <div class="panel">
    <div class="panel-header" id="panel-title">Clique em um pixel no mapa</div>
    <div id="pixel-info" style="display:none"></div>
    <div id="chart-wrap">
      <div class="placeholder" id="placeholder">
        ← Clique em um pixel para ver a fenologia
      </div>
      <canvas id="pheno-chart" style="display:none"></canvas>
      <div id="spinner"></div>
    </div>
    <div class="legend" id="legend" style="display:none">
      <div class="leg"><div class="leg-dot" style="background:#aaa"></div> EVI raw</div>
      <div class="leg"><div class="leg-dot" style="background:#4dd0e1"></div> Suavizado</div>
      <div class="leg"><div class="leg-dot" style="background:#81c784"></div> Safra (logística)</div>
      <div class="leg"><div class="leg-dot" style="background:#ffb74d"></div> Safrinha</div>
      <div class="leg"><div class="leg-dot" style="background:#ff8a65; border-top: 2px dashed #ff8a65; height:0"></div> Previsão</div>
    </div>
  </div>
</div>

<script>
// ─── Mapa ──────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomSnap: 0.5, preferCanvas: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© CartoDB © OSM', subdomains: 'abcd', maxZoom: 19
}).addTo(map);

let pixelLayer   = null;
let hexLayer     = null;
let selectedLayer = null;
let pheno_chart   = null;
let info          = null;

// ─── Colormap (EVI max: 0=amarelo, 1=verde) ────────────────────────────────
function eviColor(v, vmin=0.2, vmax=0.8) {
  const t = Math.max(0, Math.min(1, (v - vmin) / (vmax - vmin)));
  // amarelo → verde
  const r = Math.round(255 * (1 - t));
  const g = Math.round(200 + 55 * t);
  const b = Math.round(60 * (1 - t));
  return `rgb(${r},${g},${b})`;
}

// ─── Inicializa ────────────────────────────────────────────────────────────
async function init() {
  info = await fetch('/api/info').then(r => r.json());
  document.getElementById('hex-label').textContent = info.hex_id;
  document.getElementById('status').textContent =
    `${info.n_pixels} pixels · ${info.date_min} → ${info.date_max}`;

  // Hexágono boundary
  hexLayer = L.polygon(info.hex_poly.map(([lon, lat]) => [lat, lon]), {
    color: '#4a8ab4', weight: 2, fill: false
  }).addTo(map);
  map.fitBounds(hexLayer.getBounds(), { padding: [20, 20] });

  // Pixels
  const gj = await fetch('/api/pixels').then(r => r.json());
  const half = info.res_deg / 2;

  pixelLayer = L.geoJSON(gj, {
    style: f => ({
      color: '#222',
      weight: 0.3,
      fillColor: eviColor(f.properties.evi_max),
      fillOpacity: 0.75,
    }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      layer.bindTooltip(
        `EVI max: <b>${p.evi_max.toFixed(3)}</b><br>` +
        `Soja em: ${p.soja_anos.join(', ') || '—'}<br>` +
        `Obs: ${p.n_obs}`,
        { className: 'px-tip', sticky: true }
      );
      layer.on('click', () => selectPixel(p.lon, p.lat, layer, p));
    }
  }).addTo(map);

  // Legenda de cor
  buildColorLegend();
}

function buildColorLegend() {
  const ctrl = L.control({ position: 'bottomleft' });
  ctrl.onAdd = () => {
    const d = L.DomUtil.create('div');
    d.style.cssText = 'background:#1a1a2e;border:1px solid #3a5a8a;padding:6px 10px;border-radius:4px;font-size:0.72rem;color:#aaa;';
    d.innerHTML = '<b style="color:#a0c4ff">EVI máximo</b><br>';
    const steps = [0.2, 0.35, 0.5, 0.65, 0.8];
    steps.forEach(v => {
      d.innerHTML += `<span style="display:inline-block;width:14px;height:10px;background:${eviColor(v)};margin-right:3px;border-radius:2px;vertical-align:middle"></span>${v.toFixed(2)} `;
    });
    return d;
  };
  ctrl.addTo(map);
}

// ─── Seleção de pixel ──────────────────────────────────────────────────────
async function selectPixel(lon, lat, layer, props) {
  // Destaque visual
  if (selectedLayer) selectedLayer.setStyle({ weight: 0.3, color: '#222', fillOpacity: 0.75 });
  layer.setStyle({ weight: 2, color: '#fff', fillOpacity: 0.9 });
  selectedLayer = layer;

  document.getElementById('panel-title').textContent =
    `Pixel (${lon.toFixed(4)}°, ${lat.toFixed(4)}°)`;
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('pheno-chart').style.display = 'none';
  document.getElementById('spinner').style.display = 'block';

  const infoEl = document.getElementById('pixel-info');
  infoEl.style.display = 'block';
  infoEl.innerHTML = `EVI máx: <b>${props.evi_max.toFixed(3)}</b> &nbsp;|&nbsp; EVI médio: <b>${props.evi_mean.toFixed(3)}</b> &nbsp;|&nbsp; Soja em: <b>${props.soja_anos.join(', ') || '—'}</b> &nbsp;|&nbsp; ${props.n_obs} observações`;

  try {
    const data = await fetch(`/api/pixel?lon=${lon}&lat=${lat}`).then(r => r.json());
    renderChart(data);
  } catch (e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('panel-title').textContent = 'Erro ao carregar fenologia';
  }
}

// ─── Chart.js ─────────────────────────────────────────────────────────────
const CYCLE_COLORS_SAFRA   = ['#81c784', '#4caf50', '#2e7d32', '#a5d6a7'];
const CYCLE_COLORS_SAFRINHA = ['#ffb74d', '#ff9800', '#e65100', '#ffe082'];

function renderChart(data) {
  document.getElementById('spinner').style.display = 'none';

  const canvas = document.getElementById('pheno-chart');
  canvas.style.display = 'block';
  document.getElementById('legend').style.display = 'flex';

  if (pheno_chart) { pheno_chart.destroy(); pheno_chart = null; }

  const labels = data.dates;
  const datasets = [];
  const annotations = {};

  // EVI raw
  datasets.push({
    label: 'EVI raw', data: buildSeries(data.dates, data.evi),
    borderColor: 'rgba(180,180,180,0.4)', backgroundColor: 'transparent',
    pointRadius: 2.5, pointBackgroundColor: 'rgba(180,180,180,0.6)',
    borderWidth: 0.8, tension: 0,
  });

  // EVI suavizado
  datasets.push({
    label: 'Suavizado', data: buildSeries(data.dates, data.smooth),
    borderColor: '#4dd0e1', backgroundColor: 'transparent',
    pointRadius: 0, borderWidth: 1.5, tension: 0.3,
  });

  // Ciclos
  const safra_i = { i: 0 }, safrinha_i = { i: 0 };
  data.cycles.forEach((c, ci) => {
    const isSafra = c.season_type === 'safra';
    const palette  = isSafra ? CYCLE_COLORS_SAFRA : CYCLE_COLORS_SAFRINHA;
    const idx      = isSafra ? safra_i : safrinha_i;
    const color    = palette[idx.i % palette.length];
    idx.i++;

    datasets.push({
      label: `${c.season_type} ${c.cycle_start.slice(0,4)} (R²=${c.r_squared})`,
      data: buildSeries(c.curve_dates, c.curve_vals),
      borderColor: color, backgroundColor: 'transparent',
      pointRadius: 0, borderWidth: 2.5, tension: 0,
    });

    // Marcadores SOS / POS / EOS
    ['sos','pos','eos'].forEach(ph => {
      const colors = { sos: '#42a5f5', pos: '#ef9a9a', eos: '#ab47bc' };
      const labels = { sos: 'SOS', pos: 'POS', eos: 'EOS' };
      annotations[`${ph}_${ci}`] = {
        type: 'point', xValue: c[ph].date, yValue: c[ph].val,
        radius: 5, backgroundColor: colors[ph], borderColor: '#fff', borderWidth: 1.5,
      };
    });
  });

  // Extrapolação
  if (data.extrap && data.extrap.success) {
    const ex = data.extrap;
    datasets.push({
      label: 'Previsão (central)', data: buildSeries(ex.curve_dates, ex.curve_vals),
      borderColor: '#ff8a65', backgroundColor: 'rgba(255,138,101,0.08)',
      borderDash: [6, 3], pointRadius: 0, borderWidth: 2, tension: 0.3,
    });
    datasets.push({
      label: 'Previsão (sup)', data: buildSeries(ex.curve_dates, ex.curve_upper),
      borderColor: 'rgba(255,138,101,0.3)', backgroundColor: 'transparent',
      borderDash: [2, 4], pointRadius: 0, borderWidth: 1, tension: 0.3,
    });
    datasets.push({
      label: 'Previsão (inf)', data: buildSeries(ex.curve_dates, ex.curve_lower),
      borderColor: 'rgba(255,138,101,0.3)', backgroundColor: 'rgba(255,138,101,0.08)',
      borderDash: [2, 4], pointRadius: 0, borderWidth: 1, tension: 0.3, fill: '-1',
    });
    // Linha de EOS estimado
    annotations['eos_forecast'] = {
      type: 'line', xMin: ex.forecast_eos_date, xMax: ex.forecast_eos_date,
      borderColor: '#ff8a65', borderWidth: 1.5, borderDash: [4, 3],
      label: { content: `EOS est. ${ex.forecast_eos_date}`, display: true,
               color: '#ff8a65', font: { size: 10 }, position: 'start', yAdjust: -10 },
    };
  }

  // Linha de "Hoje"
  const hoje = new Date().toISOString().slice(0, 10);
  annotations['hoje'] = {
    type: 'line', xMin: hoje, xMax: hoje,
    borderColor: 'rgba(255,255,255,0.5)', borderWidth: 1.2, borderDash: [4, 4],
    label: { content: 'Hoje', display: true, color: '#aaa', font: { size: 9 }, position: 'end', yAdjust: -12 },
  };

  pheno_chart = new Chart(canvas, {
    type: 'line',
    data: {
      datasets: datasets.map(ds => ({
        ...ds,
        parsing: { xAxisKey: 'x', yAxisKey: 'y' },
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: {
          type: 'time',
          time: { unit: 'month', displayFormats: { month: 'MM/yy' } },
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#888', maxRotation: 0, font: { size: 10 } },
        },
        y: {
          title: { display: true, text: 'EVI', color: '#888', font: { size: 10 } },
          min: 0, max: 1,
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: { color: '#888', font: { size: 10 } },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1a2e', borderColor: '#3a5a8a', borderWidth: 1,
          titleColor: '#a0c4ff', bodyColor: '#ccc',
          callbacks: {
            title: items => items[0]?.label?.slice(0, 10) ?? '',
          }
        },
        annotation: { annotations },
      },
    },
  });
}

function buildSeries(dates, vals) {
  return dates.map((d, i) => ({ x: d, y: vals[i] }));
}

// ─── Boot ──────────────────────────────────────────────────────────────────
init().catch(e => {
  document.getElementById('status').textContent = 'Erro: ' + e.message;
});
</script>
</body>
</html>
